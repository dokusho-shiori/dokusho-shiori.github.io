<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="栞 - 読書管理サービス">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shiori">
  <link rel="apple-touch-icon" href="icons/Icon-192.jpg">
  <link rel="icon" type="image/jpeg" href="favicon.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <title>栞</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #F6F0E4; }
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F0E4;
      z-index: 9999;
      opacity: 1;
      transition: opacity 600ms ease;
    }
    /* アプリの準備ができたら、全体をフェードで消す（下から本棚が現れる） */
    #app-splash.is-hiding {
      opacity: 0;
      pointer-events: none;
    }
    /* ロゴはフェード（ディゾルブ）だけでふわっと出す */
    #app-splash img {
      width: 168px;
      height: 168px;
      animation: appSplashIn 900ms ease-in-out both;
    }
    @keyframes appSplashIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app-splash"><img src="splash_logo.png" alt="栞"></div>
  <script>
    (function () {
      // ロゴを最低これだけは見せる（ふわっと出きって、少し止まってから消す）
      var MIN_SHOW_MS = 1400;
      var started = false;
      function hideSplash() {
        if (started) return;
        started = true;
        var el = document.getElementById('app-splash');
        if (!el) return;
        var wait = Math.max(0, MIN_SHOW_MS - performance.now());
        setTimeout(function () {
          el.classList.add('is-hiding');
          setTimeout(function () { el.remove(); }, 700);
        }, wait);
      }
      // アプリ側から「中身を表示できる」という合図が来たら、ロゴをフェードで消す
      window.addEventListener('shiori-app-ready', hideSplash);
      // 万一合図が来ない場合の保険（アプリの最初の描画から3秒後、または8秒後）
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hideSplash, 3000);
      });
      setTimeout(hideSplash, 8000);
    })();
  </script>
  <script>
    window._deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._deferredInstallPrompt = e;
    });
    window.triggerPwaInstall = function() {
      var prompt = window._deferredInstallPrompt;
      if (!prompt) return Promise.resolve(false);
      prompt.prompt();
      return prompt.userChoice.then(function(choice) {
        window._deferredInstallPrompt = null;
        return choice.outcome === 'accepted';
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
