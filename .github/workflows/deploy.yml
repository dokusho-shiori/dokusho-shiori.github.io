# 栞を GitHub Pages に自動公開する設定
# トップ（/）＝LP、/app/＝栞アプリ
# main にアップ（Push）するたびに、自動でビルドして公開する
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # アプリは /app/ の下で動かす
      - run: flutter build web --release --base-href /app/

      # 公開用フォルダを組み立てる（LP をトップ、アプリを app フォルダへ）
      - run: |
          mkdir -p _site/app
          cp -r lp/. _site/
          cp -r build/web/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
